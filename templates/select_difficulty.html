<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdaptLearn — Select Difficulty</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="upload-page">
    <div class="grain"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="upload-container">
      <header class="site-header">
        <div class="logo">
          <span class="logo-icon">⚡</span>
          <span class="logo-text">AdaptLearn</span>
        </div>
        <div class="auth-info">
          <a href="/my-documents" class="btn-documents">📚 My Documents</a>
          <a href="/my-revisions" class="btn-documents">🗓 My Revisions</a>
          <a href="/" class="btn-back">← Upload PDF</a>
        </div>
      </header>

      <div class="hero-text">
        <h1>Select your quiz difficulty</h1>
        <p class="hero-sub">
          Choose the concept difficulty level so we can predict the right
          revision schedule.
        </p>
      </div>

      <div class="auth-card">
        <form action="/predict" method="POST">
          <div class="form-group">
            <label class="form-label" for="difficulty"
              >Concept Difficulty</label
            >
            <select
              name="difficulty"
              id="difficulty"
              class="form-input select-dark"
              required
            >
              <option value="">-- Select Difficulty --</option>
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>

          <button type="submit" class="btn-primary">
            <span class="btn-text">Get Prediction</span>
            <span class="btn-arrow">→</span>
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
